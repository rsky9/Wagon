{
  "$schema": "https://render.com/schema/render.yaml",
  "services": [
    {
      "type": "web",
      "name": "wagon-api",
      "runtime": "docker",
      "dockerfilePath": "apps/backend/Dockerfile",
      "rootDir": ".",
      "healthCheckPath": "/api/v1/health",
      "envVars": [
        { "key": "PORT", "value": "4000" },
        { "key": "NODE_ENV", "value": "production" },
        { "key": "DATABASE_URL", "fromDatabase": { "name": "wagon-db", "property": "connectionString" } },
        { "key": "REDIS_URL", "fromService": { "name": "wagon-redis", "type": "redis" } },
        { "key": "JWT_ACCESS_SECRET", "generateValue": true },
        { "key": "JWT_REFRESH_SECRET", "generateValue": true },
        { "key": "CORS_ORIGIN", "fromService": { "name": "wagon-admin", "type": "web", "envVarKey": "RENDER_EXTERNAL_URL" } }
      ]
    },
    {
      "type": "web",
      "name": "wagon-admin",
      "runtime": "node",
      "rootDir": ".",
      "buildCommand": "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @wagon/admin build",
      "startCommand": "pnpm --filter @wagon/admin start",
      "healthCheckPath": "/",
      "envVars": [
        { "key": "NEXT_PUBLIC_API_URL", "fromService": { "name": "wagon-api", "type": "web", "envVarKey": "RENDER_EXTERNAL_URL" } }
      ]
    }
  ],
  "databases": [
    { "name": "wagon-db", "databaseName": "wagon", "user": "wagon" }
  ],
  "redis": [
    { "name": "wagon-redis" }
  ]
}
