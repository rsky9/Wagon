packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@firebase/util': set this to true or false
  '@nestjs/core': set this to true or false
  protobufjs: set this to true or false
  unrs-resolver: set this to true or false

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"
  - "unrs-resolver"
  - "@firebase/util"
  - "protobufjs"

overrides:
  # Runtime security fixes for transitive deps pulled by NestJS/Express
  multer: 1.4.5-lts.1
  body-parser: 1.20.4
  qs: 6.15.3
  # Dev-tooling fixes (glob via @nestjs/cli)
  glob: 10.5.0
