packages:
  - "apps/*"
  - "packages/*"

minimumReleaseAgeExclude:
  - expo-constants@57.0.10
  - expo-notifications@57.0.10

allowBuilds:
  '@firebase/util': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  protobufjs: true
  unrs-resolver: true

overrides:
  # Runtime security fixes for transitive deps pulled by NestJS/Express
  multer: 1.4.5-lts.1
  body-parser: 1.20.4
  qs: 6.15.3
  # Dev-tooling fixes (glob via @nestjs/cli)
  glob: 10.5.0
